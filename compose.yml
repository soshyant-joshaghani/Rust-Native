# Production — single VM (backend + worker + frontend + Traefik + Postgres + Redis)
#
#   cp .env.example .env
#   __ctrl__/remote/start-prod.sh
#
# Stop:  __ctrl__/remote/stop-prod.sh
# Reset: __ctrl__/remote/reset-prod.sh  (wipe DB/Redis + app images; keeps ./letsencrypt/)
#
# 1. Set DOMAIN below (e.g. example.com) and x-prod-app-config URLs/CORS.
# 2. Point DNS A records at the VM public IP (CDN optional — origin is the VM):
#
#      Host          Type    Points to
#      ------------  ------  ---------
#      @             A       <VM IP>     → https://example.com (frontend)
#      api           A       <VM IP>     → https://api.example.com (backend)
#      adminer       A       <VM IP>     → https://adminer.example.com (optional)
#
# Adminer login (prod): server `db`, port 5432, credentials from .env — not localhost.
#
# 3. docker network create traefik-public   (once per VM)
#
# The API applies backend/migrations on start, so there is no separate prestart service.

name: rust-native

include:
  - compose.traefik.yml

x-backend-image: &backend-image
  image: rust-native-backend:prod

x-prod-app-config: &prod-app-config
  DOMAIN: example.com
  ENVIRONMENT: production
  PROJECT_NAME: rust-native
  FRONTEND_HOST: https://example.com
  BACKEND_CORS_ORIGINS: https://example.com,https://api.example.com
  SECRET_KEY: ${SECRET_KEY?Variable not set}
  FIRST_SUPERUSER: ${FIRST_SUPERUSER?Variable not set}
  FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD?Variable not set}
  POSTGRES_SERVER: db
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_USER: ${POSTGRES_USER?Variable not set}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD?Variable not set}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_DB: ${REDIS_DB:-0}
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}

services:
  redis:
    image: redis:8-alpine
    restart: always
    command:
      - sh
      - -c
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --save 60 1 --loglevel warning --requirepass "$$REDIS_PASSWORD"
        else
          exec redis-server --save 60 1 --loglevel warning
        fi
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'if [ -n "$$REDIS_PASSWORD" ]; then redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG; else redis-cli ping | grep -q PONG; fi',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    image: postgres:18
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      # postgres:18 VOLUME is /var/lib/postgresql (not .../data); default PGDATA is .../18/docker.
      # Mount the named volume at /var/lib/postgresql or Docker creates an empty anonymous volume.
      - db-data:/var/lib/postgresql
    env_file:
      - .env
    environment:
      PGDATA: /var/lib/postgresql/18/docker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD?Variable not set}
      POSTGRES_USER: ${POSTGRES_USER?Variable not set}
      POSTGRES_DB: ${POSTGRES_DB?Variable not set}

  adminer:
    image: adminer
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      ADMINER_DESIGN: pepa-linha-dark
    networks:
      - traefik-public
      - default
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.constraint-label=traefik-public
      - traefik.http.services.rust-native-adminer.loadbalancer.server.port=8080
      - traefik.http.routers.rust-native-adminer-http.rule=Host(`adminer.${DOMAIN:-example.com}`)
      - traefik.http.routers.rust-native-adminer-http.entrypoints=http
      - traefik.http.routers.rust-native-adminer-http.middlewares=https-redirect
      - traefik.http.routers.rust-native-adminer-https.rule=Host(`adminer.${DOMAIN:-example.com}`)
      - traefik.http.routers.rust-native-adminer-https.entrypoints=https
      - traefik.http.routers.rust-native-adminer-https.tls.certresolver=le

  backend:
    <<: *backend-image
    restart: always
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Sole builder for rust-native-backend:prod (the worker reuses this tag).
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - traefik-public
      - default
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.constraint-label=traefik-public
      - traefik.http.services.rust-native-backend.loadbalancer.server.port=8000
      - traefik.http.routers.rust-native-backend-http.rule=Host(`api.${DOMAIN:-example.com}`)
      - traefik.http.routers.rust-native-backend-http.entrypoints=http
      - traefik.http.routers.rust-native-backend-http.middlewares=https-redirect
      - traefik.http.routers.rust-native-backend-https.rule=Host(`api.${DOMAIN:-example.com}`)
      - traefik.http.routers.rust-native-backend-https.entrypoints=https
      - traefik.http.routers.rust-native-backend-https.tls.certresolver=le
    environment:
      <<: *prod-app-config

  worker:
    <<: *backend-image
    restart: always
    pull_policy: never
    # Image built by `backend` (shared tag). Duplicate build: races Bake export.
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    environment:
      <<: *prod-app-config
    command: ["/app/worker"]

  frontend:
    image: rust-native-frontend:prod
    restart: always
    build:
      context: frontend/web
      args:
        PUBLIC_API_BASE_URL: https://api.${DOMAIN:-example.com}/api/v1
    environment:
      PUBLIC_API_BASE_URL: https://api.${DOMAIN:-example.com}/api/v1
      NODE_ENV: production
    depends_on:
      - backend
    networks:
      - traefik-public
      - default
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.constraint-label=traefik-public
      - traefik.http.services.rust-native-frontend.loadbalancer.server.port=5000
      - traefik.http.routers.rust-native-frontend-http.rule=Host(`${DOMAIN:-example.com}`)
      - traefik.http.routers.rust-native-frontend-http.entrypoints=http
      - traefik.http.routers.rust-native-frontend-http.middlewares=https-redirect
      - traefik.http.routers.rust-native-frontend-https.rule=Host(`${DOMAIN:-example.com}`)
      - traefik.http.routers.rust-native-frontend-https.entrypoints=https
      - traefik.http.routers.rust-native-frontend-https.tls.certresolver=le

volumes:
  db-data:
  redis-data:

networks:
  traefik-public:
    name: traefik-public
    external: true
